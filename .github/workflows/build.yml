name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build APK
      run: |
        # Use the pre-installed Android SDK on the GitHub server
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
        PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
        
        # If Android 14 SDK isn't there, install it using the built-in sdkmanager
        if [ ! -d "$PLATFORM" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        fi
        
        WORKSPACE=$(pwd)
        
        # Create necessary directories
        mkdir -p $WORKSPACE/app/build
        mkdir -p $WORKSPACE/app/build/obj
        mkdir -p $WORKSPACE/app/src/main/res/values
        echo '<resources><string name="app_name">Life OS</string></resources>' > $WORKSPACE/app/src/main/res/values/strings.xml
        
        # 1. Compile Resources
        $BUILD_TOOLS/aapt2 compile --dir $WORKSPACE/app/src/main/res -o $WORKSPACE/app/build/res.zip
        
        # 2. Link Resources and Manifest
        $BUILD_TOOLS/aapt2 link -o $WORKSPACE/app/build/app-unsigned.apk -I $PLATFORM --manifest $WORKSPACE/app/src/main/AndroidManifest.xml -R $WORKSPACE/app/build/res.zip
        
        # 3. Compile Java
        javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM -d $WORKSPACE/app/build/obj $WORKSPACE/app/src/main/java/com/example/webapp/MainActivity.java
        
        # 4. Convert to Android Dex format
        $BUILD_TOOLS/d8 --lib $PLATFORM --output $WORKSPACE/app/build $WORKSPACE/app/build/obj/com/example/webapp/*.class
        
        # 5. Package HTML files into the APK correctly
        mkdir -p $WORKSPACE/app/src/main/assets
        cp $WORKSPACE/*.html $WORKSPACE/app/src/main/assets/ 2>/dev/null || true
        cp $WORKSPACE/*.json $WORKSPACE/app/src/main/assets/ 2>/dev/null || true
        cp $WORKSPACE/*.svg $WORKSPACE/app/src/main/assets/ 2>/dev/null || true
        
        cd $WORKSPACE/app/src/main
        zip -r $WORKSPACE/app/build/app-unsigned.apk assets/
        cd $WORKSPACE
        zip -j $WORKSPACE/app/build/app-unsigned.apk $WORKSPACE/app/build/classes.dex
        
        # 6. Sign the APK
        keytool -genkey -v -keystore $WORKSPACE/app/build/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myalias -storepass password -keypass password -dname "CN=Android Debug,O=Android,C=US"
        $BUILD_TOOLS/zipalign -v -p 4 $WORKSPACE/app/build/app-unsigned.apk $WORKSPACE/app/build/app-aligned.apk
        $BUILD_TOOLS/apksigner sign --ks $WORKSPACE/app/build/key.jks --ks-pass pass:password --key-pass pass:password --out $WORKSPACE/app/build/LifeOS.apk $WORKSPACE/app/build/app-aligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LifeOS-APK
        path: app/build/LifeOS.apk
