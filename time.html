<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<style>
  :root{
    --bg:#0b0712;
    --bg-2:#120b1d;
    --panel:#181024;
    --panel-2:#1f1530;
    --line:#2c1f42;
    --purple:#a855f7;
    --purple-2:#7c3aed;
    --purple-glow:rgba(168,85,247,.35);
    --text:#ece7f5;
    --muted:#9a8fb0;
    --danger:#ef4444;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(124,58,237,.28), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(168,85,247,.18), transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 60%);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:60px;
  }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;
    background:rgba(18,11,29,.78);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }

  .brand{
    display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px;font-size:16px;
  }

  .brand .dot{
    width:8px;height:8px;border-radius:50%;background:var(--purple);box-shadow:0 0 10px var(--purple-glow);
  }

  .nav-group{display:flex;gap:8px;}

  .nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;
    color:#e9d5ff;text-decoration:none;
    background:#241736;border:1px solid #3b2a58;
    padding:8px 12px;border-radius:10px;
    transition:border-color .15s, background .15s;
  }
  .nav-btn:hover{border-color:var(--purple);background:#2d1c44;}
  .nav-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;}

  /* ---------- main ---------- */
  main{max-width:720px;margin:0 auto;padding:24px 20px 20px;}

  /* ---------- date header ---------- */
  .date-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;
  }
  .date-header h2{margin:0;font-size:18px;font-weight:600;color:#fff;}
  
  .cal-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 15px;font:inherit;font-size:13.5px;color:var(--text);
    background:linear-gradient(180deg,#2a1a3f,#1d1230);
    border:1px solid #3b2a58;border-radius:11px;cursor:pointer;
    transition:border-color .18s, box-shadow .18s, transform .1s;
  }
  .cal-btn:hover{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.14);}
  .cal-btn:active{transform:translateY(1px);}
  .cal-btn svg{width:16px;height:16px;stroke:var(--purple);}

  /* ---------- activity log ---------- */
  .log-card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:20px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }

  .table-wrap{border:1px solid #2b1e42;border-radius:12px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  
  thead th{
    text-align:left;padding:10px 14px;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
    background:#140d20;border-bottom:1px solid #2b1e42;white-space:nowrap;
  }

  tbody td{padding:11px 14px;border-bottom:1px solid #221736;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(168,85,247,.06);}
  
  td.date{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  th.time,td.time{text-align:right;}
  td.time{color:#d8c7f5;font-variant-numeric:tabular-nums;white-space:nowrap;}

  tbody tr.unaccounted td{
    border-top:1px dashed #3a2757;border-bottom:none;background:rgba(168,85,247,.05);
  }
  tbody tr.unaccounted td.name-cell{color:#e9d5ff;font-weight:600;}
  tbody tr.unaccounted td.time{color:#c4b5fd;font-weight:600;}

  .empty-state{
    padding:28px 14px;text-align:center;font-size:13.5px;
    color:var(--muted);border:1px dashed #33244d;border-radius:12px;
  }

  .hidden{display:none !important;}

  /* ---------- add activity trigger ---------- */
  .add-trigger{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:16px;padding:14px 20px;
    font:inherit;font-size:14.5px;font-weight:600;letter-spacing:.2px;color:#fff;
    background:linear-gradient(180deg,var(--purple),var(--purple-2));
    border:1px solid #8b5cf6;border-radius:16px;cursor:pointer;
    box-shadow:0 8px 24px rgba(124,58,237,.28);transition:filter .15s, transform .1s;
  }
  .add-trigger:hover{filter:brightness(1.1);}
  .add-trigger:active{transform:translateY(1px);}
  .add-trigger svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none;}

  /* ---------- overlays & sheets ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,3,12,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .modal-content{
    width:100%;max-width:340px;padding:18px 18px 16px;border-radius:18px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid #3a2757;
    box-shadow:0 0 0 1px rgba(168,85,247,.10),0 24px 60px rgba(0,0,0,.6);
    transform:translateY(10px);transition:transform .18s ease;
  }
  .overlay.open .modal-content{transform:translateY(0);}

  /* ---------- calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .month{font-size:15px;font-weight:600;letter-spacing:.3px;}
  .nav-btn-cal{
    width:32px;height:32px;display:grid;place-items:center;
    font:inherit;font-size:18px;line-height:1;color:var(--text);
    background:#241735;border:1px solid #3b2a58;border-radius:9px;cursor:pointer;
  }
  .nav-btn-cal:hover{border-color:var(--purple);background:#2d1c44;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .dow{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:center;padding:6px 0 8px;}
  .day{
    aspect-ratio:1/1;display:grid;place-items:center;font-size:13.5px;
    font-variant-numeric:tabular-nums;color:var(--text);background:transparent;
    border:1px solid transparent;border-radius:50%;cursor:pointer;
    transition:background .13s,border-color .13s,color .13s;
  }
  .day:hover{background:#2b1c42;border-color:#4a3370;}
  .day.blank{visibility:hidden;cursor:default;}
  .day.today{border-color:var(--purple);color:#e9d5ff;font-weight:600;}
  .day.selected{background:linear-gradient(180deg,var(--purple),var(--purple-2));border-color:var(--purple);color:#fff;font-weight:600;box-shadow:0 0 16px var(--purple-glow);}

  /* ---------- add form modal ---------- */
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;}
  .sheet-close{
    width:30px;height:30px;display:grid;place-items:center;font:inherit;font-size:18px;line-height:1;
    color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;
  }
  .sheet-close:hover{border-color:#3b2a58;color:var(--text);}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field span{font-size:12px;letter-spacing:.4px;color:var(--muted);}
  .field input{
    font:inherit;font-size:14px;color:var(--text);background:#140d20;
    border:1px solid #33244d;border-radius:10px;padding:10px 12px;
    outline:none;transition:border-color .15s, box-shadow .15s;width:100%;
  }
  .field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.16);}
  .field input::-webkit-calendar-picker-indicator{filter:invert(.75) hue-rotate(240deg);cursor:pointer;}

  .time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-bottom:6px;}
  .time-row .field{margin-bottom:0;}
  .time-row input{text-align:center;font-variant-numeric:tabular-nums;padding:10px 6px;}
  .colon{padding-bottom:11px;font-size:16px;color:var(--muted);user-select:none;}

  .field-error{
    display:none;margin:0 0 12px;padding:9px 12px;font-size:12.5px;
    color:#fecaca;background:#2a1119;border:1px solid #5b1f2c;border-radius:9px;
  }
  .field-error.show{display:block;}

  .save-btn{
    width:100%;margin-top:8px;padding:13px 20px;font:inherit;font-size:14px;font-weight:600;color:#fff;
    background:linear-gradient(180deg,var(--purple),var(--purple-2));border:1px solid #8b5cf6;
    border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.28);
    transition:filter .15s, transform .1s;
  }
  .save-btn:hover{filter:brightness(1.1);}
  .save-btn:active{transform:translateY(1px);}
  .save-btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}

  @media (max-width:520px){
    .topbar{padding:12px 14px;}
    main{padding:20px 14px;}
    .log-card{padding:16px;}
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>Time Tracker
    </div>
    <div class="nav-group">
      <a href="index.html" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Tasks
      </a>
      <a href="historical.html" class="nav-btn">
        History
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </div>
  </header>

  <main>
    <div class="date-header">
      <h2 id="dateTitle">Today</h2>
      <button class="cal-btn" id="calBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <path d="M8 3v4M16 3v4M3 10h18"></path>
        </svg>
        Select Date
      </button>
    </div>

    <section class="log-card">
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Activity</th>
              <th class="time">Time</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>

      <div class="empty-state hidden" id="emptyState">No data saved.</div>

      <button class="add-trigger" id="addTrigger">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Log Unplanned Activity</span>
      </button>
    </section>
  </main>

  <!-- Calendar Overlay -->
  <div class="overlay" id="calOverlay" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="cal-head">
        <button class="nav-btn-cal" id="prevBtn" type="button">‹</button>
        <div class="month" id="monthLabel"></div>
        <button class="nav-btn-cal" id="nextBtn" type="button">›</button>
      </div>
      <div class="grid" id="dowRow"></div>
      <div class="grid" id="daysGrid"></div>
    </div>
  </div>

  <!-- Add Activity Overlay -->
  <div class="overlay" id="addOverlay" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="sheet-head">
        <h3>Log Activity</h3>
        <button class="sheet-close" id="addClose" type="button">×</button>
      </div>

      <form id="addForm" autocomplete="off">
        <label class="field">
          <span>Activity name</span>
          <input type="text" id="addName" placeholder="What did you do?" required>
        </label>

        <div class="time-row">
          <label class="field">
            <span>Hrs</span>
            <input type="number" id="addHrs" min="0" max="23" step="1" value="0" inputmode="numeric">
          </label>
          <span class="colon">:</span>
          <label class="field">
            <span>Min</span>
            <input type="number" id="addMin" min="0" max="59" step="1" value="0" inputmode="numeric">
          </label>
        </div>

        <div class="field-error" id="addError"></div>
        <button class="save-btn" id="addSave" type="submit">Save Log</button>
      </form>
    </div>
  </div>

<script>
(function(){
  'use strict';

  const DB_NAME = 'lifeos';
  const DB_VERSION = 1;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MAX_MINS = 1440;

  let db = null;
  let selectedDate = new Date();
  let currentDateKey = "";
  
  // Calendar State
  let viewYear = selectedDate.getFullYear();
  let viewMonth = selectedDate.getMonth();

  /* ---------- DOM ---------- */
  const dateTitle = document.getElementById('dateTitle');
  const tableWrap = document.getElementById('tableWrap');
  const logBody = document.getElementById('logBody');
  const emptyState = document.getElementById('emptyState');
  const addTrigger = document.getElementById('addTrigger');

  const calOverlay = document.getElementById('calOverlay');
  const calBtn = document.getElementById('calBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const monthLabel = document.getElementById('monthLabel');
  const dowRow = document.getElementById('dowRow');
  const daysGrid = document.getElementById('daysGrid');

  const addOverlay = document.getElementById('addOverlay');
  const addClose = document.getElementById('addClose');
  const addForm = document.getElementById('addForm');
  const addName = document.getElementById('addName');
  const addHrs = document.getElementById('addHrs');
  const addMin = document.getElementById('addMin');
  const addError = document.getElementById('addError');
  const addSave = document.getElementById('addSave');

  /* ---------- HELPERS ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function toKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function fromKey(key){ const p = key.split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
  
  function prettyDate(key){
    const d = fromKey(key);
    return DOW[d.getDay()] + ', ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate() + ' ' + d.getFullYear();
  }
  
  function fmtDuration(mins){
    let totalSec = Math.round(Math.abs(mins) * 60);
    const h = Math.floor(totalSec / 3600); totalSec -= h * 3600;
    const m = Math.floor(totalSec / 60); totalSec -= m * 60;
    const s = totalSec;
    const parts = [];
    if (h) parts.push(h + 'h');
    if (m) parts.push(m + 'm');
    if (s || !parts.length) parts.push(s + 's');
    return (mins < 0 ? '-' : '') + parts.join(' ');
  }

  /* ---------- DB OPS ---------- */
  function openDB(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onsuccess = (e)=>{ db = e.target.result; resolve(); };
      req.onerror = (e)=>reject(e.target.error);
    });
  }

  function getLogsByDate(dateStr){
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('logs', 'readonly');
      const idx = tx.objectStore('logs').index('date');
      const req = idx.getAll(dateStr);
      req.onsuccess = (e)=>resolve(e.target.result || []);
      req.onerror = (e)=>reject(e.target.error);
    });
  }

  function addLog(record){
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('logs', 'readwrite');
      const req = tx.objectStore('logs').add(record);
      req.onsuccess = ()=>resolve();
      req.onerror = (e)=>reject(e.target.error);
    });
  }

  /* ---------- RENDER ---------- */
  async function loadData(){
    currentDateKey = toKey(selectedDate);
    dateTitle.textContent = prettyDate(currentDateKey);

    try {
      const items = await getLogsByDate(currentDateKey);
      items.sort((a,b)=>a.id - b.id); // sort by insertion order
      renderTable(items);
    } catch (err) {
      console.error(err);
      emptyState.textContent = 'Could not read database.';
      tableWrap.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }
  }

  function renderTable(items){
    logBody.innerHTML = '';

    if (!items.length){
      tableWrap.classList.add('hidden');
      emptyState.classList.remove('hidden');
      emptyState.textContent = 'No data saved.';
      return;
    }

    emptyState.classList.add('hidden');
    tableWrap.classList.remove('hidden');

    let total = 0;

    items.forEach(item => {
      const mins = item.minutes || 0;
      total += mins;

      const tr = document.createElement('tr');
      
      const tdDate = document.createElement('td');
      tdDate.className = 'date';
      tdDate.textContent = item.date;

      const tdName = document.createElement('td');
      tdName.className = 'name-cell';
      tdName.textContent = item.name;

      const tdTime = document.createElement('td');
      tdTime.className = 'time';
      tdTime.textContent = fmtDuration(mins);

      tr.appendChild(tdDate);
      tr.appendChild(tdName);
      tr.appendChild(tdTime);
      logBody.appendChild(tr);
    });

    // Unaccounted Time Row
    const unacc = Math.max(0, MAX_MINS - total);
    
    const unTr = document.createElement('tr');
    unTr.className = 'unaccounted';

    const uDate = document.createElement('td');
    uDate.className = 'date';
    uDate.textContent = '—';

    const uName = document.createElement('td');
    uName.className = 'name-cell';
    uName.textContent = 'Unaccounted Time';

    const uTime = document.createElement('td');
    uTime.className = 'time';
    uTime.textContent = fmtDuration(unacc);

    unTr.appendChild(uDate);
    unTr.appendChild(uName);
    unTr.appendChild(uTime);
    logBody.appendChild(unTr);
  }

  /* ---------- CALENDAR ---------- */
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    dowRow.appendChild(el);
  });

  function renderCalendar(){
    monthLabel.textContent = MONTHS[viewMonth] + ' ' + viewYear;
    daysGrid.innerHTML = '';
    
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for (let i=0; i<firstDay; i++){
      const b = document.createElement('div'); b.className = 'day blank'; daysGrid.appendChild(b);
    }

    for (let d=1; d<=daysInMonth; d++){
      const date = new Date(viewYear, viewMonth, d);
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'day'; el.textContent = d;
      
      const isSelected = (d === selectedDate.getDate() && viewMonth === selectedDate.getMonth() && viewYear === selectedDate.getFullYear());
      const isToday = toKey(date) === toKey(new Date());
      
      if (isToday) el.classList.add('today');
      if (isSelected) el.classList.add('selected');

      el.addEventListener('click', ()=>{
        selectedDate = date;
        calOverlay.classList.remove('open');
        loadData();
      });
      daysGrid.appendChild(el);
    }
  }

  calBtn.addEventListener('click', ()=>{
    viewYear = selectedDate.getFullYear();
    viewMonth = selectedDate.getMonth();
    renderCalendar();
    calOverlay.classList.add('open');
  });

  prevBtn.addEventListener('click', ()=>{ viewMonth--; if (viewMonth<0){viewMonth=11; viewYear--;} renderCalendar(); });
  nextBtn.addEventListener('click', ()=>{ viewMonth++; if (viewMonth>11){viewMonth=0; viewYear++;} renderCalendar(); });
  calOverlay.addEventListener('click', (e)=>{ if (e.target===calOverlay) calOverlay.classList.remove('open'); });

  /* ---------- ADD MANUAL ACTIVITY ---------- */
  addTrigger.addEventListener('click', ()=>{
    addName.value = '';
    addHrs.value = 0;
    addMin.value = 0;
    addError.classList.remove('show');
    addOverlay.classList.add('open');
    setTimeout(()=>addName.focus(), 100);
  });

  addClose.addEventListener('click', ()=>addOverlay.classList.remove('open'));
  addOverlay.addEventListener('click', (e)=>{ if (e.target===addOverlay) addOverlay.classList.remove('open'); });

  addForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    addError.classList.remove('show');

    const name = addName.value.trim();
    const hrs = Math.max(0, Math.min(23, Math.floor(Number(addHrs.value)||0)));
    const mins = Math.max(0, Math.min(59, Math.floor(Number(addMin.value)||0)));
    const totalMins = (hrs * 60) + mins;

    if (!name){ addError.textContent = 'Give the activity a name.'; addError.classList.add('show'); return; }
    if (totalMins <= 0){ addError.textContent = 'Time must be greater than zero.'; addError.classList.add('show'); return; }

    addSave.disabled = true;

    try {
      const existing = await getLogsByDate(currentDateKey);
      const dayTotal = existing.reduce((sum, i) => sum + (i.minutes || 0), 0);
      const remaining = MAX_MINS - dayTotal;

      if (remaining <= 0){
        addError.textContent = 'This day already has 24h logged.';
        addError.classList.add('show');
        return;
      }

      if (totalMins > remaining){
        addError.textContent = 'Too much — only ' + fmtDuration(remaining) + ' left for this day.';
        addError.classList.add('show');
        return;
      }

      await addLog({
        date: currentDateKey,
        name: name.toUpperCase(),
        minutes: totalMins
      });

      addOverlay.classList.remove('open');
      await loadData();
    } catch (err) {
      console.error(err);
      addError.textContent = 'Could not save. Try again.';
      addError.classList.add('show');
    } finally {
      addSave.disabled = false;
    }
  });

  /* ---------- BOOT ---------- */
  openDB().then(loadData).catch(err => {
    console.error(err);
    tableWrap.classList.add('hidden');
    emptyState.classList.remove('hidden');
    emptyState.textContent = 'Database not found. Run db-deploy.html once.';
  });

})();
</script>
</body>
</html>
